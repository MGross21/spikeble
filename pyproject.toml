[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "spikeble"
description = "BLE interface for running Micropython on LEGO SPIKE devices"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Michael Gross", email = "MGross21@users.noreply.github.com" }]
keywords = ["lego", "spike", "ble", "bluetooth", "robotics"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries",
  "Topic :: System :: Hardware",
]
dependencies = ["bleak>=1.0.0"]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/MGross21/spikeble"
Repository = "https://github.com/MGross21/spikeble"
Issues = "https://github.com/MGross21/spikeble/issues"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"
raw-options = { local_scheme = "no-local-version" }

[tool.hatch.build.targets.wheel]
packages = ["spikeble"]
include = ["spikeble/py.typed"]

[tool.hatch.build.targets.wheel.force-include]
"stubs/app-stubs" = "app-stubs"
"stubs/color-stubs" = "color-stubs"
"stubs/color_matrix-stubs" = "color_matrix-stubs"
"stubs/color_sensor-stubs" = "color_sensor-stubs"
"stubs/device-stubs" = "device-stubs"
"stubs/distance_sensor-stubs" = "distance_sensor-stubs"
"stubs/force_sensor-stubs" = "force_sensor-stubs"
"stubs/hub-stubs" = "hub-stubs"
"stubs/motor-stubs" = "motor-stubs"
"stubs/motor_pair-stubs" = "motor_pair-stubs"
"stubs/orientation-stubs" = "orientation-stubs"
"stubs/runloop-stubs" = "runloop-stubs"

[tool.hatch.build.targets.sdist]
include = ["/spikeble", "/stubs", "/README.md", "/LICENSE*", "/pyproject.toml"]

# ---- Tooling ---------------------------------------------------------------

[tool.ruff]
target-version = "py311"
line-length = 80
extend-exclude = ["stubs"]
force-exclude = true
lint.select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]
